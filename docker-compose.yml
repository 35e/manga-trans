# The whole thing on one origin: podman compose up --build, localhost:8080.

services:
  api:
    build:
      context: ./api
      args:
        PREFETCH_MODEL: "true"
    # Published so the API can be curled directly; the dashboard goes through
    # nginx on the same origin as itself.
    ports:
      - "8000:8000"
    environment:
      # Left open for anything curling port 8000 above.
      MANGA_TRANS_ORIGIN: "*"
    # Docker needs telling; Podman answers host.containers.internal by itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    init: true
    restart: unless-stopped
